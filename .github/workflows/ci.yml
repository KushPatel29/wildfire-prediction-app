name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a green badge means the tests pass now, not on the day of the last push.
  schedule:
    - cron: "23 9 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The Power BI project is generated. If the committed one and the spec have
      # drifted apart, the dashboard in the repository is not the dashboard the
      # code describes - and nothing else would notice.
      - run: python -m powerbi.build_pbip --check
      - run: pytest -q
        env:
          WILDFIRE_OFFLINE: "1"
