[project]
name = "wildfire-prediction-app"
version = "1.0.0"
description = "Seven-day wildfire risk for Canada: the FWI System, the National Fire Database and gradient boosting, served live."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["legacy"]
